<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-24d56970-4350-4bba-84dc-10d3a36ca835/styles.css">
<style>
:root[data-theme="dark"]{
  --color-bg:#141312;--color-surface:#201e1d;--color-text:#f3f2f2;
  --color-divider:color-mix(in srgb,#f3f2f2 40%,transparent);
  --color-accent:#ff563c;--color-neutral-100:#1b1a19;--color-neutral-200:#262423;
  color-scheme:dark;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-neutral-100);color:var(--color-text)}
a{color:var(--color-accent);text-underline-offset:3px}
a:hover{color:var(--color-accent-600)}
:root[data-theme="dark"] a:hover{color:var(--color-accent-400)}
</style>
</helmet>
<div style="background:var(--color-neutral-100);color:var(--color-text);font-family:var(--font-body);min-height:100vh">

  <header style="border-bottom:2px solid var(--color-divider);background:var(--color-neutral-100)">
    <div style="max-width:820px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <a href="Research Portfolio.dc.html" style="font-family:var(--font-heading);font-weight:800;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-text);text-decoration:none;opacity:0.7" style-hover="opacity:1;color:var(--color-accent)">← {{ backLabel }}</a>
      <button type="button" onClick="{{ toggleTheme }}" style="font-family:var(--font-heading);font-weight:800;font-size:12px;letter-spacing:0.06em;background:transparent;border:2px solid var(--color-divider);border-radius:0;padding:6px 10px;cursor:pointer;color:var(--color-text)" style-hover="border-color:var(--color-accent);color:var(--color-accent)">{{ themeLabel }}</button>
    </div>
  </header>

  <main style="max-width:820px;margin:0 auto;padding:0 24px 96px">

    <section style="padding:64px 0 40px;border-bottom:2px solid var(--color-divider)">
      <p style="margin:0 0 14px;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600;color:var(--color-accent)">Notebook</p>
      <h1 style="font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,9vw,88px);line-height:0.94;letter-spacing:-0.03em;margin:0 0 20px">Diary</h1>
      <p style="margin:0;font-size:18px;line-height:1.7;max-width:44ch;opacity:0.72;text-wrap:pretty">Gadgets, papers, and things I found interesting. Written quickly, in whichever language the thought arrived in.</p>
    </section>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--color-divider)">
      <div style="display:flex;gap:0;border:2px solid var(--color-divider)">
        <button type="button" onClick="{{ filterAll }}" style="{{ btnAll }}">All</button>
        <button type="button" onClick="{{ filterEn }}" style="{{ btnEn }}">EN</button>
        <button type="button" onClick="{{ filterJa }}" style="{{ btnJa }}">日本語</button>
      </div>
      <span style="font-size:13px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;opacity:0.55">{{ countLabel }}</span>
    </div>

    <div>
      <sc-for list="{{ entries }}" as="e" hint-placeholder-count="3">
        <article style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 32px;padding:44px 0;border-bottom:1px solid var(--color-divider)">
          <div>
            <p style="margin:0;font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:0.04em;color:var(--color-accent)">{{ e.dateLabel }}</p>
            <p style="margin:4px 0 0;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;opacity:0.45">{{ e.langLabel }}</p>
          </div>
          <div style="grid-column:span 2;min-width:0;border-left:2px solid var(--color-accent-300);padding-left:24px">
            <h2 style="font-family:var(--font-heading);font-weight:800;font-size:clamp(24px,3.4vw,34px);line-height:1.12;letter-spacing:-0.02em;margin:0 0 18px;text-wrap:pretty">{{ e.title }}</h2>
            <sc-for list="{{ e.body }}" as="para" hint-placeholder-count="2">
              <p style="margin:0 0 16px;font-size:17px;line-height:1.85;max-width:58ch;text-wrap:pretty">{{ para }}</p>
            </sc-for>
          </div>
        </article>
      </sc-for>
    </div>

    <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ showAll }}" style="width:100%;margin-top:32px;background:transparent;border:2px solid var(--color-divider);padding:18px;cursor:pointer;color:var(--color-text);font-family:var(--font-heading);font-weight:800;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;text-align:left" style-hover="border-color:var(--color-accent);color:var(--color-accent)">{{ moreLabel }} ↓</button>
    </sc-if>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <p style="padding:64px 0;font-size:17px;opacity:0.55">Nothing here yet in this language.</p>
    </sc-if>
  </main>

  <footer style="border-top:2px solid var(--color-divider)">
    <div style="max-width:820px;margin:0 auto;padding:28px 24px 56px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;opacity:0.6">
      <a href="Research Portfolio.dc.html" style="color:var(--color-text);text-decoration:none" style-hover="color:var(--color-accent)">Research portfolio ↗</a>
      <span>{{ year }}</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PAGE = 10;

class Component extends DCLogic {
  state = { theme: 'light', entries: null, filter: 'all', limit: PAGE };

  componentDidMount() {
    const theme = localStorage.getItem('site-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    this.setState({ theme });
    import('./diary.js').then(m => this.setState({ entries: m.ENTRIES }));
  }

  fmt(iso) {
    const [y, m, d] = iso.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.replace(/^0/, '') + ' ' + months[Number(m) - 1] + ' ' + y;
  }

  segStyle(active) {
    return {
      fontFamily: 'var(--font-heading)', fontWeight: 800, fontSize: '12px',
      letterSpacing: '0.06em', padding: '8px 14px', cursor: 'pointer',
      border: 0, borderRadius: 0,
      background: active ? 'var(--color-accent)' : 'transparent',
      color: active ? '#fff' : 'var(--color-text)'
    };
  }

  renderVals() {
    const all = this.state.entries || [];
    const sorted = all.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const filtered = this.state.filter === 'all' ? sorted : sorted.filter(e => e.lang === this.state.filter);
    const shown = filtered.slice(0, this.state.limit);
    const rest = filtered.length - shown.length;
    return {
      backLabel: 'Research portfolio',
      themeLabel: this.state.theme === 'dark' ? 'LIGHT' : 'DARK',
      year: String(new Date().getFullYear()),
      toggleTheme: () => {
        const next = this.state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('site-theme', next);
        document.documentElement.setAttribute('data-theme', next);
        this.setState({ theme: next });
      },
      btnAll: this.segStyle(this.state.filter === 'all'),
      btnEn: this.segStyle(this.state.filter === 'en'),
      btnJa: this.segStyle(this.state.filter === 'ja'),
      filterAll: () => this.setState({ filter: 'all', limit: PAGE }),
      filterEn: () => this.setState({ filter: 'en', limit: PAGE }),
      filterJa: () => this.setState({ filter: 'ja', limit: PAGE }),
      countLabel: filtered.length + (filtered.length === 1 ? ' entry' : ' entries'),
      entries: shown.map(e => ({
        dateLabel: this.fmt(e.date),
        langLabel: e.lang === 'ja' ? '日本語' : 'English',
        title: e.title,
        body: e.body
      })),
      hasMore: rest > 0,
      moreLabel: 'Show ' + rest + ' older ' + (rest === 1 ? 'entry' : 'entries'),
      showAll: () => this.setState({ limit: this.state.limit + PAGE }),
      isEmpty: !!this.state.entries && filtered.length === 0
    };
  }
}
</script>
</body>
</html>
